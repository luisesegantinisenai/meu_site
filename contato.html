<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="cabecalho">
        <div class="logo">📽️ CineSENAI 📽️</div>
        <nav class="menu">
            <a href="index.html">Em cartaz</a>
            <a href="">Em breve</a>
            <a href="">Preços</a>
            <a href="">Contato</a>
        </nav>
    </header>

    <main class="container">
        <h1 class="titulo-secao">Cadastro para dicas de Filmes</h1>
        <p class="subtitulo">Preencha seus dados para realizar a inscrição no CineSENAI</p>

        <div class="area-inscricao">

            <form action="/processar-cadastro" method="post" class="coluna-form">

                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" placeholder="Digite Seu Nome" required minlength="3" maxlength="50"><br>

                <label for="senha">Senha de Acesso:</label>
                <input type="password" id="senha" name="senha" placeholder="Digite Sua Senha" required minlength="8" maxlength="15"><br>

                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" placeholder="exemplo@dominio.com" required><br>

                <label for="data_nasc">Data de Nascimento:</label>
                <input type="date" id="data_nasc" name="data_nascimento" min="1900-01-01" max="2026-12-31" required><br><br>
                
                <label>Período dos Filmes:</label><br>
                <input type="radio" id="turno_manha" name="turno" value="manha" required>
                <label for="turno_manha">Manhã</label><br>

                <input type="radio" id="turno_tarde" name="turno" value="tarde">
                <label for="turno_tarde">Tarde</label><br>

                <input type="radio" id="turno_noite" name="turno" value="noite">
                <label for="turno_noite">Noite</label><br><br>

                <label>Filmes de Interesse</label><br>
                <input type="checkbox" id="acao" name="interesse" value="acao">
                <label for="acao">Filme de Acao</label><br>

                <input type="checkbox" id="comedia" name="interesse" value="comedia">
                <label for="comedia">Filme de Comedia</label><br>

                <input type="checkbox" id="terror" name="interesse" value="terror">
                <label for="terror">Filme de Terror</label><br><br>

                <label for="unidade">Selecione o Cinema</label>
                <select name="unidade" id="unidade" required>
                    <option value="" disabled selected>Selecione um Cinema:</option>
                    <option value="sp">São Paulo - Capital</option>
                    <option value="sebastianopolis">Sebastianópolis Do Sul</option>
                    <option value="votuporanga">Votuporanga</option>
                    <option value="valentim">Valentim Gentil</option>

                </select><br><br>
                <input type="checkbox" id="termos" name="termos" required>
                <label for="termos">LI e Aceito os Termos</label> <br><br>

                <button type="submit" class="btn-enviar">Enviar</button>
                <button type="reset" class="btn-limpar">Limpar Tudo </button>


            </form>

            <div class="coluna-midia">
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2848.1440624281586!2d-49.978320026054156!3d-20.419885453747717!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x94bd5920dedb8125%3A0xc3ffc4655949fbc6!2sPra%C3%A7a%20Da%20Matriz%20Dr.%20Fernando%20Costa!5e1!3m2!1spt-BR!2sbr!4v1787665699720!5m2!1spt-BR!2sbr" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>

                <iframe width="560" height="315" src="https://www.youtube.com/embed/Nrt8lh0x-hQ?si=gOQF4qAUKSyYXLkB" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

            </div>

        </div>

    </main>
</body>
</html>
